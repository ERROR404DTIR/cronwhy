<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">CronWhy</title><desc id="d">A cron schedule is visualized as a moving clock and timeline.</desc><defs><linearGradient id="bg"><stop stop-color="#1a263e"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><circle cx="880" cy="150" r="92" fill="#102037" stroke="#536b8c" stroke-width="4"/><circle cx="880" cy="150" r="5" fill="#62e3c1"/><path d="M880 150V85M880 150L930 175" stroke="#62e3c1" stroke-width="5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 880 150" to="360 880 150" dur="12s" repeatCount="indefinite"/></path><g stroke="#8fa8ff" stroke-width="3"><path d="M880 48V62M982 150H968M880 252V238M778 150H792"/></g><text x="82" y="130" fill="#edf3ff" font-family="monospace" font-size="42">*/15 * * * *</text><text x="84" y="180" fill="#91a0ba" font-family="monospace" font-size="16" letter-spacing="3">EVERY 15 MINUTES</text><path d="M84 215H610" stroke="#62e3c1" stroke-width="3" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" values="0;-68" dur="2.5s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">CRONWHY</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">SCHEDULE / EXPLAIN / PREDICT</text></svg>