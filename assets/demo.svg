<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="cronwhy terminal demo">
  <style>
    .l{font-family:Consolas,Menlo,monospace;font-size:15px;opacity:0;animation:show 10s infinite}
    .p{fill:#34d399}.c{fill:#67e8f9}.d{fill:#94a3b8}.w{fill:#e2e8f0}
    .a1{animation-delay:0s}.a2{animation-delay:1s}.a3{animation-delay:1.8s}.a4{animation-delay:2.4s}
    .a5{animation-delay:3s}.a6{animation-delay:4.6s}.a7{animation-delay:5.2s}.a8{animation-delay:5.8s}.a9{animation-delay:7s}
    @keyframes show{0%{opacity:0}3%{opacity:1}92%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="760" height="250" rx="12" fill="#0b1220"/>
  <rect width="760" height="30" rx="12" fill="#1e293b"/>
  <circle cx="20" cy="15" r="6" fill="#f87171"/><circle cx="40" cy="15" r="6" fill="#fbbf24"/><circle cx="60" cy="15" r="6" fill="#4ade80"/>
  <text class="l a1" x="20" y="60"><tspan class="p">$</tspan><tspan class="w"> python cronwhy.py "*/15 9-17 * * 1-5"</tspan></text>
  <text class="l a2" x="20" y="84" xml:space="preserve"><tspan class="d">  Meaning  </tspan><tspan class="c">Runs every 15 minutes, hour 9 through 17,</tspan></text>
  <text class="l a3 c" x="20" y="104" xml:space="preserve">           on Monday through Friday.</text>
  <text class="l a4 w" x="20" y="132" xml:space="preserve">  1. Thu 2026-11-12 09:00   in 12m</text>
  <text class="l a5 w" x="20" y="152" xml:space="preserve">  2. Thu 2026-11-12 09:15   in 27m</text>
  <text class="l a6" x="20" y="186"><tspan class="p">$</tspan><tspan class="w"> python cronwhy.py 30 2 * * sun</tspan></text>
  <text class="l a7" x="20" y="210" xml:space="preserve"><tspan class="d">  Meaning  </tspan><tspan class="c">At 02:30, on Sunday.</tspan></text>
  <text class="l a8 w" x="20" y="230" xml:space="preserve">  1. Sun 2026-11-15 02:30   in 2d 16h 41m</text>
</svg>
